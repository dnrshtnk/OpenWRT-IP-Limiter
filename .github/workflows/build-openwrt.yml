name: Build OpenWrt packages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Makefile'
      - 'htdocs/**'
      - 'root/**'
      - '.github/workflows/build-openwrt.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: OpenWrt 25.12.6 x86/64
            release: '25.12.6'
            target: x86/64
            sdk: openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sha256: 1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc
            downloads: https://downloads.openwrt.org/releases
            artifact: luci-app-iplimiter-openwrt-25.12.6-x86-64
          - label: OpenWrt 25.12.5 MediaTek Filogic
            release: '25.12.5'
            target: mediatek/filogic
            sdk: openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sha256: ff4a38a397caa2cfe1c39e18f84ddede14878221b3593c3f2c4cfe24e3ec4c25
            downloads: https://archive.openwrt.org/releases
            artifact: luci-app-iplimiter-openwrt-25.12.5-mediatek-filogic

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build host dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: Download and verify OpenWrt SDK
        env:
          RELEASE: ${{ matrix.release }}
          TARGET: ${{ matrix.target }}
          SDK: ${{ matrix.sdk }}
          SDK_SHA256: ${{ matrix.sha256 }}
          DOWNLOADS: ${{ matrix.downloads }}
        run: |
          wget -q "$DOWNLOADS/$RELEASE/targets/$TARGET/$SDK"
          echo "$SDK_SHA256  $SDK" | sha256sum -c -
          mkdir sdk
          tar --zstd -xf "$SDK" -C sdk --strip-components=1

      - name: Add package to SDK
        run: |
          mkdir -p sdk/package/luci-app-iplimiter
          cp -a Makefile htdocs root sdk/package/luci-app-iplimiter/
          cd sdk
          echo CONFIG_PACKAGE_luci-app-iplimiter=m >> .config
          make defconfig

      - name: Build package APK
        run: make -C sdk package/luci-app-iplimiter/compile V=s

      - name: Collect APK artifact
        run: |
          mkdir -p dist
          apk_file=$(find sdk/bin/packages -type f -name 'luci-app-iplimiter*.apk' -print -quit)
          if [ -z "$apk_file" ]; then
            echo 'No luci-app-iplimiter APK was found. Package output files:'
            find sdk/bin/packages -type f -print | sort
            exit 1
          fi
          echo "Found package: $apk_file"
          cp "$apk_file" dist/

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/luci-app-iplimiter*.apk
          if-no-files-found: error
          retention-days: 14
