name: Build OpenWrt package

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Makefile'
      - 'htdocs/**'
      - 'root/**'
      - '.github/workflows/build-openwrt.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install build host dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: Download OpenWrt SDK 25.12.6 x86/64
        run: |
          wget -q https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          echo '1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc  openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst' | sha256sum -c -
          mkdir sdk
          tar --zstd -xf openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst -C sdk --strip-components=1

      - name: Add package to SDK
        run: |
          mkdir -p sdk/package/luci-app-iplimiter
          cp -a Makefile htdocs root sdk/package/luci-app-iplimiter/
          cd sdk
          echo CONFIG_PACKAGE_luci-app-iplimiter=m >> .config
          make defconfig

      - name: Build package APK
        run: make -C sdk package/luci-app-iplimiter/compile V=s

      - name: Collect APK artifact
        run: |
          mkdir -p dist
          apk_file=$(find sdk/bin/packages -type f -name 'luci-app-iplimiter*.apk' -print -quit)
          if [ -z "$apk_file" ]; then
            echo 'No luci-app-iplimiter APK was found. Package output files:'
            find sdk/bin/packages -type f -print | sort
            exit 1
          fi
          echo "Found package: $apk_file"
          cp "$apk_file" dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-iplimiter-openwrt-25.12.6-x86-64
          path: dist/luci-app-iplimiter*.apk
          if-no-files-found: error
          retention-days: 14
